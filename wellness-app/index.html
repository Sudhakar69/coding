<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinFrnd Secure Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="mobile-shell">
      <section class="login-card" aria-label="FinFrnd login">
        <h1 class="brand">FinFrnd</h1>

        <form id="login-form" class="stack" autocomplete="off">
          <label>
            Username
            <input id="username" type="text" placeholder="john.doe" required />
          </label>

          <label>
            Password
            <input id="password" type="password" placeholder="••••••••" required />
          </label>

          <fieldset class="mpin-fieldset">
            <legend>MPIN</legend>
            <div id="mpin-boxes" class="mpin-boxes" role="group" aria-label="Enter 4 digit MPIN">
              <input class="mpin" inputmode="numeric" maxlength="1" pattern="[0-9]" type="password" />
              <input class="mpin" inputmode="numeric" maxlength="1" pattern="[0-9]" type="password" />
              <input class="mpin" inputmode="numeric" maxlength="1" pattern="[0-9]" type="password" />
              <input class="mpin" inputmode="numeric" maxlength="1" pattern="[0-9]" type="password" />
            </div>
          </fieldset>

          <label class="remember">
            <input id="cache-mpin" type="checkbox" checked /> Cache MPIN locally on this device
          </label>

          <button id="login-btn" type="submit">Log In</button>
        </form>

        <div class="actions">
          <button id="register-btn" class="secondary" type="button">Register</button>
          <button id="finger-btn" class="secondary" type="button">Use Fingerprint</button>
        </div>

        <details>
          <summary>Google Drive setup</summary>
          <p>
            Login credentials are read from a JSON file in Google Drive (public file URL recommended for demo).
            For production, use OAuth + backend proxy.
          </p>
          <label>
            Drive File ID
            <input id="drive-file-id" type="text" placeholder="1AbCdEf..." />
          </label>
          <label>
            API Key
            <input id="drive-api-key" type="password" placeholder="AIza..." />
          </label>
          <label>
            Register Webhook URL (optional)
            <input id="register-webhook" type="url" placeholder="https://script.google.com/..." />
          </label>
        </details>

        <p id="status" class="status" aria-live="polite">Ready.</p>
      </section>

      <footer>Copyright © 2026 FinFrnd</footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
