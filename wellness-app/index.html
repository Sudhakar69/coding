<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinFrnd Secure Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="mobile-shell">
      <header class="hero">
        <div>
          <p class="greeting">Welcome back,</p>
          <h1>FinFrnd</h1>
          <p class="subtitle">Secure banking made friendly</p>
        </div>
        <button class="ghost-btn" type="button">Need Help?</button>
      </header>

      <section class="login-card" aria-label="FinFrnd login">
        <div class="profile-row">
          <div class="avatar">FF</div>
          <div>
            <h2 id="customer-name">Gudise Sudhakar</h2>
            <p class="customer-id">CRN • XXXX133</p>
          </div>
        </div>

        <p class="instruction">Login using your MPIN or biometric authentication.</p>

        <button id="biometric-btn" class="biometric" type="button">
          <span class="bio-icon">◎</span>
          Login with Fingerprint / Face ID
        </button>

        <div class="or-divider"><span>OR</span></div>

        <div class="mpin-wrap">
          <label class="mpin-label" for="mpin-1">Enter 6-digit MPIN</label>
          <div class="mpin-boxes" role="group" aria-label="Enter 6 digit MPIN">
            <input id="mpin-1" class="mpin" inputmode="numeric" maxlength="1" pattern="[0-9]" type="password" />
            <input class="mpin" inputmode="numeric" maxlength="1" pattern="[0-9]" type="password" />
            <input class="mpin" inputmode="numeric" maxlength="1" pattern="[0-9]" type="password" />
            <input class="mpin" inputmode="numeric" maxlength="1" pattern="[0-9]" type="password" />
            <input class="mpin" inputmode="numeric" maxlength="1" pattern="[0-9]" type="password" />
            <input class="mpin" inputmode="numeric" maxlength="1" pattern="[0-9]" type="password" />
          </div>
        </div>

        <div class="quick-actions">
          <button id="login-btn" class="primary" type="button">Login with MPIN</button>
          <button class="link-btn" type="button">Forgot MPIN?</button>
        </div>

        <p id="status" class="status" aria-live="polite">Ready to login securely.</p>
      </section>

      <nav class="bottom-nav" aria-label="Bottom navigation">
        <button type="button">Home</button>
        <button type="button">Cards</button>
        <button type="button" class="scan">Scan</button>
        <button type="button">Offers</button>
        <button type="button">More</button>
      </nav>
    </main>

    <script src="app.js"></script>
  </body>
</html>
