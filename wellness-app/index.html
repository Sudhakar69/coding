<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinFrnd Secure Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="phone-frame" aria-label="FinFrnd mobile login">
        <div class="phone-screen">
          <header class="brand-wrap">
            <div class="logo-mark" aria-hidden="true">ff</div>
            <div>
              <h1>FinFrnd</h1>
              <p>Smart Banking</p>
            </div>
          </header>

          <p class="welcome">Welcome back</p>

          <form id="login-form" class="login-form" autocomplete="off">
            <label class="sr-only" for="crn">CRN</label>
            <input id="crn" type="text" placeholder="CRN - XXXX192" required />

            <label class="sr-only" for="mpin">MPIN</label>
            <input id="mpin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Enter 6 digit MPIN" required />

            <div class="row-end">
              <button id="forgot-mpin" type="button" class="link-btn">Forgot MPIN?</button>
            </div>

            <button id="login-btn" type="submit" class="primary-btn">Login</button>
          </form>

          <p class="divider">--OR--</p>

          <button id="biometric-btn" type="button" class="bio-btn">Unlock with Face ID / Fingerprint</button>

          <details class="setup-panel">
            <summary>App setup</summary>
            <label>
              Drive File ID
              <input id="drive-file-id" type="text" placeholder="1AbCdEf..." />
            </label>
            <label>
              API Key
              <input id="drive-api-key" type="password" placeholder="AIza..." />
            </label>
            <label>
              Register Webhook URL (optional)
              <input id="register-webhook" type="url" placeholder="https://script.google.com/..." />
            </label>
            <div class="setup-actions">
              <button id="register-btn" class="secondary-btn" type="button">Register User</button>
              <button id="enroll-bio-btn" class="secondary-btn" type="button">Enroll Biometric</button>
            </div>
          </details>

          <p id="status" class="status" aria-live="polite">Ready.</p>

          <footer>
            <a href="#">Secure Banking</a>
            <span>|</span>
            <a href="#">Privacy Policy</a>
          </footer>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
